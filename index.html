<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics Directory</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161a22;
      --accent-color: #ff2a5f;
      --accent-hover: #ff537c;
      --text-main: #f0f3f8;
      --text-sub: #9da7b8;
      --border-color: #222836;
      --row-hover: #1c2230;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px 15px 60px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      color: var(--accent-color);
      font-size: 2rem;
      margin-bottom: 5px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1rem;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      padding: 12px 16px;
      color: var(--accent-color);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border-color);
      transition: color 0.2s;
    }

    th:hover {
      color: var(--accent-hover);
    }

    th .sort-icon {
      font-size: 0.75rem;
      margin-left: 4px;
      display: inline-block;
      color: var(--text-sub);
    }

    td {
      padding: 14px 16px;
      font-size: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    tbody tr {
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    .artist-col {
      font-weight: 600;
      color: var(--text-main);
    }

    .song-col {
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Lyrics Library</h1>
      <p class="subtitle">Select a song to view lyrics and translations</p>
    </header>

    <div class="table-container">
      <table id="lyrics-table">
        <thead>
          <tr>
            <th onclick="sortTable('artist')">Artist <span id="sort-artist" class="sort-icon">↕</span></th>
            <th onclick="sortTable('song')">Song <span id="sort-song" class="sort-icon">↕</span></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows dynamically rendered via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ========================================================
    // SONG DATABASE (JSON)
    // Add new songs here. Ensure "path" is relative to this file.
    // ========================================================
    const songsData = [
      {
        "artist": "Karol G",
        "song": "Gatúbela",
        "path": "Karol G - Gatubela.html"
      },
      {
        "artist": "Thalia",
        "song": "Arrasando",
        "path": "Thalia - Arrasando.html"
      },
      {
        "artist": "Wisin",
        "song": "Vacaciones",
        "path": "Wisin - Vacaciones.html"
      },
    ];

    let currentSortColumn = null;
    let isAscending = true;

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      data.forEach(item => {
        const tr = document.createElement('tr');
        
        // Tap/click row to navigate to file
        tr.onclick = () => {
          window.location.href = item.path;
        };

        tr.innerHTML = `
          <td class="artist-col">${item.artist}</td>
          <td class="song-col">${item.song}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    function sortTable(column) {
      if (currentSortColumn === column) {
        isAscending = !isAscending;
      } else {
        currentSortColumn = column;
        isAscending = true;
      }

      // Update sort indicators
      document.getElementById('sort-artist').textContent = '↕';
      document.getElementById('sort-song').textContent = '↕';
      document.getElementById(`sort-${column}`).textContent = isAscending ? '▲' : '▼';

      // Sort JSON data
      songsData.sort((a, b) => {
        const valA = a[column].toLowerCase();
        const valB = b[column].toLowerCase();

        if (valA < valB) return isAscending ? -1 : 1;
        if (valA > valB) return isAscending ? 1 : -1;
        return 0;
      });

      renderTable(songsData);
    }

    // Initial render on load
    document.addEventListener('DOMContentLoaded', () => {
      renderTable(songsData);
    });
  </script>
</body>
</html>
